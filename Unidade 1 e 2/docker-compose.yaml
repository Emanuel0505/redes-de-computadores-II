networks:
  lab_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/25

volumes:
  avahi_socket:

services:
  server-dhcp:
    container_name: dhcp
    hostname: dhcp-dns
    image: dockurr/dnsmasq:latest
    cap_add:
      - NET_ADMIN
    volumes:
      - ./server-dhcp/dnsmasq.conf:/etc/dnsmasq.conf:ro
      - ./server-dhcp/order.sh:/etc/dnsmasq.d/order.sh:ro
      - ./server-mdns/allowlist:/etc/dnsmasq.d/mdns-allowlist:ro
      - ./server-mdns/hosts:/etc/dnsmasq.d/mdns-hosts:rw
    restart: always
    networks:
      lab_net:
        ipv4_address: 172.20.0.3

  server-mdns:
    container_name: mdns
    hostname: mdns
    build: ./server-mdns
    volumes:
      - ./server-mdns/hosts:/etc/avahi/hosts:ro
      - avahi_socket:/run/avahi-daemon
    restart: always
    networks:
      lab_net:
        ipv4_address: 172.20.0.4
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/avahi-daemon/socket"]
      interval: 1s
      timeout: 1s
      retries: 10

  server1-proxy:
    container_name: redes
    hostname: proxy
    build:
      context: .
      dockerfile: dockerfile-app-setup
    command: ["httpd-foreground"]
    cap_add:
      - NET_ADMIN
    ports:
      - "8081:8084"
    working_dir: /usr/local/apache2
    volumes:
      - ./server1-proxy/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./server1-proxy/extra:/usr/local/apache2/conf/extra:ro
      - ./server1-proxy/static:/usr/local/apache2/htdocs:ro
      - avahi_socket:/run/avahi-daemon:ro
    depends_on:
      server-dhcp:
        condition: service_started
      server-mdns:
        condition: service_healthy
      server2:
        condition: service_started
      server3:
        condition: service_started
      server4:
        condition: service_started
    networks:
      lab_net:
        ipv4_address: 172.20.0.7

  server2:
    hostname: server2
    build:
      context: .
      dockerfile: dockerfile-app-setup
    ports:
      - "8080:8083"
    command: ["httpd-foreground"]
    working_dir: /usr/local/apache2
    volumes:
      - ./server2/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./server2/static:/usr/local/apache2/htdocs:ro
    depends_on:
      - server-dhcp
    cap_add:
      - NET_ADMIN
    networks:
      lab_net:

  server3:
    hostname: server3
    build:
      context: .
      dockerfile: dockerfile-app-setup
    ports:
      - "8082:80"
    command: ["httpd-foreground"]
    working_dir: /usr/local/apache2
    volumes:
      - ./server3/static:/usr/local/apache2/htdocs:ro
      - ./server3/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    depends_on:
      - server-dhcp
    cap_add:
      - NET_ADMIN
    networks:
      lab_net:

  server4:
    hostname: server4
    build:
      context: .
      dockerfile: dockerfile-app-setup
    ports:
      - "8083:80"
    command: ["httpd-foreground"]
    working_dir: /usr/local/apache2
    volumes:
      - ./server4/static:/usr/local/apache2/htdocs:ro
      - ./server4/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    depends_on:
      - server-dhcp
    cap_add:
      - NET_ADMIN
    networks:
      lab_net: