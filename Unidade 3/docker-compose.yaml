services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
  
  subscriber:
    build:
      context: .
      dockerfile: JS/Dockerfile.node
    environment:
      MQTT_HOST: mosquitto
    depends_on:
      - mosquitto

  publisher:
    build:
      context: .
      dockerfile: Python/Dockerfile.python
    environment:
      MQTT_HOST: mosquitto
    depends_on:
      - mosquitto