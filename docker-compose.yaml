networks:
  lab_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          ip_range: 172.20.0.128/25
          gateway: 172.20.0.1
services: 
  server-dhcp:
    container_name: dhcp
    image: dockurr/dnsmasq:latest
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./server-dhcp/dnsmasq.d/:/etc/dnsmasq.d/:ro
      - ./server-dhcp/leases/:/var/lib/dnsmasq/
    network_mode: host
    networks:
      lab_net:
        ipv4_address: 172.20.0.3
      
    
  server1-proxy:
    container_name: redes
    image: httpd:latest
    ports: 
      - "8081:8084"
    working_dir: /usr/local/apache2 
    volumes:
      - ./server1-proxy/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro 
      - ./server1-proxy/extra:/usr/local/apache2/conf/extra:ro #ro: é read only
      - ./server1-proxy/static:/usr/local/apache2/htdocs:ro 
    depends_on:
      - server2
      - server3
    networks:
      lab_net: 
        ipv4_address: 172.20.0.10
    dns: 172.20.0.2

  server-dns:
    container_name: dns
    image: ubuntu/bind9:latest
    environment:
      - BIND9_USER=bind
    volumes:
      - ./server-dns/named.conf:/etc/bind/named.conf:ro
      - ./server-dns/db.lab:/etc/bind/db.lab:ro
    networks:
      lab_net:
        ipv4_address: 172.20.0.2
  
  server-dns2:
    container_name: dns
    image: dockurr/dnsmasq:latest
    environment:
      DNS1: "1.0.0.1"
      DNS2: "1.1.1.1"
    ports:
      - "5354:53/udp"
      - "5354:53/tcp"
    cap_add:
      - NET_ADMIN
    volumes:
      - ./server-dns2/named.conf:/etc/dnsmasq.d/:ro
    networks:
      lab_net:
        ipv4_address: 172.20.0.3

  server2:
    image: httpd:latest
    ports:
      - "8080:8083"
    working_dir: /usr/local/apache2
    volumes:
      - ./server2/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./server2/static:/usr/local/apache2/htdocs:ro 
    networks:
      lab_net: 
        ipv4_address: 172.20.0.11

  server3:
    image: httpd:latest
    ports:
      - "8082:80"
    working_dir: /usr/local/apache2
    volumes:
      - ./server3/static:/usr/local/apache2/htdocs:ro
    networks:
      lab_net: 
        ipv4_address: 172.20.0.12


    
