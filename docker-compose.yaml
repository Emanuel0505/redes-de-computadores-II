networks:
  lab_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/25

services:
  server-dhcp:
    container_name: dhcp
    hostname: dhcp-dns
    image: dockurr/dnsmasq:latest
    cap_add:
      - NET_ADMIN
    volumes:
      - ./server-dhcp/dnsmasq.conf:/etc/dnsmasq.conf:ro
    restart: always
    networks:
      lab_net:
        ipv4_address: 172.20.0.3

  server1-proxy:
    container_name: redes
    hostname: proxy
    build:
      context: .
      dockerfile: dockerfile-app-setup
    command: ["httpd-foreground"]
    cap_add:
      - NET_ADMIN
    ports:
      - "8081:8084"
    working_dir: /usr/local/apache2
    volumes:
      - ./server1-proxy/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./server1-proxy/extra:/usr/local/apache2/conf/extra:ro
      - ./server1-proxy/static:/usr/local/apache2/htdocs:ro
    depends_on:
      - server-dhcp
      - server2
      - server3
    networks:
      lab_net:
        ipv4_address: 172.20.0.7

  server2:
    hostname: server2
    build:
      context: .
      dockerfile: dockerfile-app-setup
    ports:
      - "8080:8083"
    command: ["httpd-foreground"]
    working_dir: /usr/local/apache2
    volumes:
      - ./server2/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./server2/static:/usr/local/apache2/htdocs:ro
    depends_on:
      - server-dhcp
    cap_add:
      - NET_ADMIN
    networks:
      lab_net:
  server3:
    hostname: server3
    build:
      context: .
      dockerfile: dockerfile-app-setup
    ports:
      - "8082:80"
    command: ["httpd-foreground"]
    working_dir: /usr/local/apache2
    volumes:
      - ./server3/static:/usr/local/apache2/htdocs:ro
      - ./server3/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    depends_on:
      - server-dhcp
    cap_add:
      - NET_ADMIN
    networks:
      lab_net: