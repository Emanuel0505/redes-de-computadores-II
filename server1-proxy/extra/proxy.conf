
<VirtualHost *:8084>

    ServerName localhost

    DocumentRoot "/usr/local/apache2/htdocs"
    
    ProxyPreserveHost On 

    RequestHeader set X-Real-IP expr=%{REMOTE_ADDR}

    SetEnv proxy-nokeepalive 1

    <Proxy balancer://redirecionando>
        BalancerMember http://server2.lab:8083/ disablereuse=On
        BalancerMember http://server3.lab:80/ disablereuse=On
        ProxySet lbmethod=byrequests
    </Proxy>

    ProxyPass /server/ balancer://redirecionando/
    ProxyPassReverse /server/ balancer://redirecionando/

</VirtualHost>