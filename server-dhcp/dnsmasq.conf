interface=eth0
server=8.8.8.8
server=1.1.1.1
dhcp-range=172.20.0.50,172.20.0.100,255.255.255.0,12h
dhcp-option=option:router, 172.20.0.1
dhcp-option=option:dns-server, 172.20.0.2

domain=lab
local=/lab/
auth-zone=lab
expand-hosts
addn-hosts=/etc/dnsmasq.d/dinamic-hosts
dhcp-script=/etc/dnsmasq.d/order.sh

auth-server=dhcp-dns.lab
host-record=dhcp-dns.lab,172.20.0.3

cache-size=1000
log-dhcp