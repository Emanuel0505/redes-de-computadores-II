interface=eth0
bind-interfaces
no-resolv
server=8.8.8.8
server=1.1.1.1

domain=lab
local=/lab/
expand-hosts
domain-needed
bogus-priv

dhcp-range=172.20.0.50,172.20.0.100,255.255.255.0,12h
dhcp-host=proxy,172.20.0.7
dhcp-option=option:router,172.20.0.1
dhcp-option=option:dns-server,172.20.0.3

host-record=dhcp-dns.lab,172.20.0.3

cache-size=1000
log-dhcp